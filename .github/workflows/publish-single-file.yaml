name: Publish single-file app

on:
  push:
    tags:
      - "releases/v*"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore .\Pail.slnx

      - name: Build
        shell: pwsh
        run: dotnet build .\Pail.slnx --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test .\Pail.slnx --configuration Release --no-build

  publish:
    needs: build-and-test
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-x86
          - win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish ${{ matrix.rid }}
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\${{ matrix.rid }}"

          dotnet publish .\src\Pail.App\Pail.App.csproj `
            --configuration Release `
            --runtime ${{ matrix.rid }} `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:CopyOutputSymbolsToPublishDirectory=false `
            -p:PublishDir="$publishDir\"

      - name: Upload ${{ matrix.rid }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: Pail-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/
          if-no-files-found: error

  create-release:
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: Pail-*
          path: release-assets

      - name: Package release assets
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'release-packages'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          Push-Location .\release-assets
          try {
            $artifactDirs = @(Get-ChildItem -Directory | Sort-Object Name)

            if ($artifactDirs.Count -eq 0) {
              throw 'No release artifact directories were downloaded.'
            }

            foreach ($artifactDir in $artifactDirs) {
              $archivePath = Join-Path $packageDir ($artifactDir.Name + '.zip')

              if (Test-Path $archivePath) {
                Remove-Item $archivePath -Force
              }

              Compress-Archive -Path $artifactDir.Name -DestinationPath $archivePath -CompressionLevel Optimal
            }
          }
          finally {
            Pop-Location
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          $tag = '${{ github.ref_name }}'
          $assets = @(Get-ChildItem -Path .\release-packages -Filter '*.zip' -File | Sort-Object Name | ForEach-Object { $_.FullName })

          if ($assets.Count -eq 0) {
            throw 'No release assets were downloaded.'
          }

          gh release create $tag $assets `
            --title "Pail $tag" `
            --verify-tag `
            --notes "Automated release for \`$tag\` tag." `
            --generate-notes
