name: Publish single-file app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/publish-single-file.yaml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'NuGet.config'
      - 'Pail.slnx'
      - 'src/**'
      - 'test/**'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore .\Pail.slnx

      - name: Build
        shell: pwsh
        run: dotnet build .\Pail.slnx --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test .\Pail.slnx --configuration Release --no-build

  publish:
    needs: build-and-test
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-x86
          - win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish ${{ matrix.rid }}
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\${{ matrix.rid }}"
          $assetPath = Join-Path $publishDir "Pail-${{ matrix.rid }}.exe"

          dotnet publish .\src\Pail.App\Pail.App.csproj `
            --configuration Release `
            --runtime ${{ matrix.rid }} `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:CopyOutputSymbolsToPublishDirectory=false `
            -p:PublishDir="$publishDir\"

          Copy-Item (Join-Path $publishDir 'Pail.exe') $assetPath

      - name: Upload ${{ matrix.rid }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: Pail-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/Pail-${{ matrix.rid }}.exe
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: Pail-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $assets = @(Get-ChildItem -Path .\release-assets -File | Sort-Object Name | ForEach-Object { $_.FullName })

          if ($assets.Count -eq 0) {
            throw 'No release assets were downloaded.'
          }

          gh release create $tag $assets `
            --title "Pail $tag" `
            --verify-tag `
            --notes "Automated release for \`$tag\` tag."
            --generate-notes
